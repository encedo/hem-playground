# /etc/acme-dns/config.cfg - acme-dns for the HEM Playground certificate
# (playground.ence.do + *.playground.ence.do). Answers only for acme.playground.ence.do;
# DNS on the public address, the API on loopback only.
[general]
listen = "38.133.142.202:53"
protocol = "both"
domain = "acme.playground.ence.do"
nsname = "ns-acme.playground.ence.do"
nsadmin = "support.encedo.com"
records = [
    "acme.playground.ence.do. A 38.133.142.202",
    "acme.playground.ence.do. NS ns-acme.playground.ence.do.",
    "ns-acme.playground.ence.do. A 38.133.142.202",
]
debug = false
[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"
[api]
ip = "127.0.0.1"
disable_registration = false
port = "8053"
tls = "none"
corsorigins = []
use_header = false
header_name = "X-Forwarded-For"
[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"

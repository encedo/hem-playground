# /etc/nginx/sites-available/playground.ence.do  (symlink in sites-enabled)
# HEM Playground: one container on 127.0.0.1:8090, routed inside by the Host header.
# Nothing here touches attest.encedo.com or pki.encedo.com.

limit_req_zone $binary_remote_addr zone=playground_ip:10m rate=50r/s;

# Plain HTTP is served, not redirected: a module answers HTTP like a PPA does
# (418 on the endpoints that need TLS), and hem-api-tester uses both.
server {
    listen 80;
    listen [::]:80;
    server_name playground.ence.do *.playground.ence.do;
    more_clear_headers Server;            # a module sends no software banner (libnginx-mod-http-headers-more-filter)

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / {
        limit_req zone=playground_ip burst=100 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/playground-proxy.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Orig-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name playground.ence.do *.playground.ence.do;

    # one wildcard certificate (*.playground.ence.do + playground.ence.do), DNS-01 at DigitalOcean
    ssl_certificate     /etc/letsencrypt/live/playground.ence.do/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playground.ence.do/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    more_clear_headers Server;            # a module sends no software banner (hem-api-tester T-1.6)

    # firmware / Manager uploads go up to 16 MiB
    client_max_body_size 17m;

    location / {
        limit_req zone=playground_ip burst=100 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/snippets/playground-proxy.conf;
        # the module is the TLS server name, also for a request without a Host header (HTTP/1.0)
        proxy_set_header Host $ssl_server_name;
        proxy_set_header X-Orig-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
